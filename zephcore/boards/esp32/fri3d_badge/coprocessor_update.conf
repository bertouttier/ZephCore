# Fri3d Camp 2026 badge — optional coprocessor firmware update at boot
#
# board_init.c installs the coprocessor firmware 2.0.4 over RVSWD before main()
# when the coprocessor runs an older version or none (it does not answer), then
# restarts. Off by default: it needs the zephyr-rvswd module, which the default
# workspace leaves out. To use it:
#
#   west config manifest.group-filter +fri3d-coprocessor-update
#   west update
#   west build -b fri3d_badge@2026/esp32s3/procpu zephcore --sysbuild -- \
#     -Dzephcore_EXTRA_CONF_FILE=boards/esp32/fri3d_badge/coprocessor_update.conf
#
# The image is the badge module's (fri3d-badge, firmware/); the path is relative
# to the application (zephcore/).

CONFIG_MFD_FRI3D_EXPANDER_UPDATE=y
CONFIG_MFD_FRI3D_EXPANDER_FIRMWARE="../modules/fri3d/badge/firmware/coprocessor_2.0.4.bin"
CONFIG_MFD_FRI3D_EXPANDER_FIRMWARE_VERSION="2.0.4"
