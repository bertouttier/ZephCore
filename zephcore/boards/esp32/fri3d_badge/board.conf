# Fri3d Camp 2026 badge — ESP32-S3 + Seeed Wio-SX1262
#
# Hardware:
#   ESP32-S3-WROOM-1-N16R8 (16 MB flash, 8 MB octal PSRAM, enabled by the board)
#   Seeed Wio-SX1262 (868 MHz) on SPI2 (shared with the LCD and the SD card):
#     NSS=IO45, DIO1=IO40, BUSY=IO41, RF switch IO46 (high = RX), DIO2 drives TX,
#     TCXO on DIO3 at 1.8 V, RESET on the CH32X035 coprocessor (I2C 0x50)
#   ST7789 2" LCD, CST816S touch, buttons and joystick on the coprocessor
#   START button IO0 (sw0), 5 x WS2812 on IO12
#   Console on the USB-Serial/JTAG (USB-C)
#   Flash: the board's partitions, LittleFS in the second APP CPU slot (partitions.overlay)
#
# Include order: prj.conf → zephcore_common.conf → esp32_common.conf → board.conf

CONFIG_ZEPHCORE_BOARD_NAME="Fri3d Badge 2026"
CONFIG_BT_DIS_MODEL_NUMBER_STR="Fri3d Camp 2026 badge"

CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_SPIRAM_MODE_OCT=y

# The LoRa reset and the 3V3_AUX rail (LoRa, LCD, ...) are on the coprocessor:
# its MFD driver (I2C) and GPIO controller, and the board's power domain.
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_MFD=y
CONFIG_POWER_DOMAIN=y

# Heartbeat LED: the debug LED on the coprocessor's LED controller (led0)
CONFIG_LED=y

# Battery: the board's fuel-gauge0, a composite gauge over the coprocessor's
# battery voltage sensor and charger status
CONFIG_FUEL_GAUGE=y
CONFIG_SENSOR=y
CONFIG_CHARGER=y

# MeshCore's EU narrow preset sends at up to 14 dBm by default on the badge
CONFIG_ZEPHCORE_DEFAULT_TX_POWER_DBM=14
