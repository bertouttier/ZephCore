# Fri3d Camp 2026 badge — optional: the communicator add-on's keyboard
#
# The Communicator 2026 add-on (Fri3dCamp/communicator_2026, firmware v1.1.0 or
# later) types into the joystick UI's text screens: its keyboard as input
# events (communicator.overlay, paired with this file), its typing keys made
# typed characters by board_init.c, with Shift and Caps Lock. The arrows, Enter,
# Esc and Backspace drive the UI like the joystick; F3 goes home. Without the
# add-on its driver gives up 1.5 s after boot. Off by default: it needs the
# communicator_2026 module, which the default workspace leaves out. To use it:
#
#   west config manifest.group-filter +fri3d-communicator
#   west update
#   west build -b fri3d_badge@2026/esp32s3/procpu zephcore --sysbuild -- \
#     -DEXTRA_CONF_FILE=boards/esp32/fri3d_badge/communicator.conf
#
# Plain EXTRA_CONF_FILE, not zephcore_EXTRA_CONF_FILE: ZephCore pairs it with
# communicator.overlay only as a user conf. Together with
# coprocessor_update.conf: "-DEXTRA_CONF_FILE=<one>;<the other>".

CONFIG_INPUT=y
CONFIG_MFD_FRI3D_COMMUNICATOR=y
CONFIG_INPUT_FRI3D_COMMUNICATOR=y
